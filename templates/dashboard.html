<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.duplicate.css') }}">
</head>
<body class="body">
  <div class="container" style="text-align: center; padding: 40px;">
    <h2 class="head">Welcome, {{ firstname }}! 🎉</h2>
    <p style="color: #555; margin-bottom: 25px;">You have successfully logged into your account.</p>
    
    <form action="/logout" method="POST">
      <button type="submit" class="sign-button" style="background-color: #d9534f;">Logout</button>
    </form>
  </div>
</body>
</html>
